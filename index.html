<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Auto Location</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body style="text-align:center;font-family:sans-serif;padding-top:60px;">
  <h3>กำลังดึงตำแหน่ง...</h3>

<script>
async function main() {
  await liff.init({ liffId: "2009188891-cjzhkEr2" })

  // ถ้าไม่ได้เปิดใน LINE
  if (!liff.isInClient()) {
    alert("กรุณาเปิดผ่านแชท LINE OA เท่านั้น")
    return
  }

  if (!navigator.geolocation) {
    alert("อุปกรณ์ไม่รองรับ GPS")
    liff.closeWindow()
    return
  }

  navigator.geolocation.getCurrentPosition(
    async function(position) {

      await liff.sendMessages([{
        type: "location",
        title: "ตำแหน่งลูกค้า",
        address: "ตำแหน่งปัจจุบัน",
        latitude: position.coords.latitude,
        longitude: position.coords.longitude
      }])

      liff.closeWindow()
    },
    function(error) {
      alert("กรุณาอนุญาตตำแหน่ง")
      liff.closeWindow()
    }
  )
}

main()
</script>

</body>
</html>

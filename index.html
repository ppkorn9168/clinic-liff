<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Clinic Location</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>
<body style="text-align:center;font-family:sans-serif;padding-top:50px;">

  <h2>📍 แชร์ตำแหน่งคลินิก</h2>
  <button onclick="sendLocation()" 
    style="padding:15px 30px;font-size:18px;background:#06C755;color:white;border:none;border-radius:10px;">
    ส่งตำแหน่ง
  </button>

<script>
  async function main() {
    await liff.init({ liffId: "2009188891-cjzhkEr2" })
  }

  async function sendLocation() {
    await liff.sendMessages([
      {
        type: "location",
        title: "คลินิกของเรา",
        address: "ใส่ที่อยู่คลินิกที่นี่",
        latitude: 13.7563,
        longitude: 100.5018
      }
    ])
    liff.closeWindow()
  }

  main()
</script>

</body>
</html>

<!DOCTYPE html>
<html>
<head>
  <meta charset="utf-8" />
  <title>Clinic Location</title>
  <script src="https://static.line-scdn.net/liff/edge/2/sdk.js"></script>
</head>

<body style="text-align:center;font-family:sans-serif;padding-top:60px;">
  <h3>กำลังดึงตำแหน่งของคุณ...</h3>

<script>
async function main() {
  await liff.init({ liffId: "3baef06c9d0bbe6d6abbcb0d3bc61f88" })

  if (!navigator.geolocation) {
    alert("อุปกรณ์ไม่รองรับ GPS")
    liff.closeWindow()
    return
  }

  navigator.geolocation.getCurrentPosition(
    async function(position) {

      const lat = position.coords.latitude
      const lng = position.coords.longitude

      await liff.sendMessages([
        {
          type: "location",
          title: "ตำแหน่งลูกค้า",
          address: "ตำแหน่งปัจจุบัน",
          latitude: lat,
          longitude: lng
        }
      ])

      liff.closeWindow()
    },
    function(error) {
      alert("กรุณาอนุญาตให้เข้าถึงตำแหน่ง")
      liff.closeWindow()
    }
  )
}

main()
</script>

</body>
</html>

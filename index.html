<script>
async function main() {
  await liff.init({ liffId: "2009188891-cjzhkEr2" });

  if (!navigator.geolocation) {
    alert("อุปกรณ์ไม่รองรับการดึงตำแหน่ง");
    return;
  }

  navigator.geolocation.getCurrentPosition(
    async (position) => {
      await liff.sendMessages([{
        type: "location",
        title: "ตำแหน่งลูกค้า",
        address: "แชร์จากคลินิก",
        latitude: position.coords.latitude,
        longitude: position.coords.longitude
      }]);

      liff.closeWindow();
    },
    (error) => {
      alert("กรุณาอนุญาตการเข้าถึงตำแหน่ง");
      liff.closeWindow();
    }
  );
}

main();
</script>
